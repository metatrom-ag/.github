name: Bug Report
description: Report a bug or issue
type: Bug
labels: ["bug", "triage"]
projects: ["metatrom-ag/6"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        This bug will go through **triage** before being worked on.
        Complex fixes may have sub-issues for individual actions.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - "Critical - System unusable"
        - "High - Major feature broken"
        - "Medium - Feature impaired"
        - "Low - Minor issue"
    validations:
      required: true

  - type: textarea
    id: goes-through
    attributes:
      label: Goes through
      description: "The files or folders the work changes, as far as you know them — one per line, a file where known, else its folder; the estimate counts from it."
      placeholder: |
        src/orders/total.ts
        docs/
    validations:
      required: true

  - type: dropdown
    id: story-points
    attributes:
      label: Story Points
      description: "Complexity as a size, 1/2/3/5/8 — XL means split; a parent carries the sum of its sub-issues"
      options:
        - "Unknown"
        - "1 - XS"
        - "2 - S"
        - "3 - M"
        - "5 - L"
        - "8 - XL (split)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did this occur?
      placeholder: "e.g., Production, Staging, Local dev"
    validations:
      required: false

  - type: textarea
    id: system-info
    attributes:
      label: System Information
      description: Relevant system info (OS, browser, version, etc.)
      placeholder: |
        - OS: macOS 14.0
        - Browser: Chrome 120
        - App Version: 1.2.3
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Any relevant logs, error messages, or screenshots
      placeholder: Paste logs or drag & drop screenshots here
    validations:
      required: false
