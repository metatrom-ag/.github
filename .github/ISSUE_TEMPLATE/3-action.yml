name: Action
description: A concrete action linked to an Idea or Bug
type: Action
labels: ["action"]
projects: ["metatrom-ag/6"]
body:
  - type: markdown
    attributes:
      value: |
        ## Action (What)
        Create this as a **sub-issue** from a parent Issue.

  - type: textarea
    id: description
    attributes:
      label: Action Description
      description: What needs to be done? (optional for small tasks)
      placeholder: Describe the concrete action
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this action is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: false

  - type: textarea
    id: goes-through
    attributes:
      label: Goes through
      description: "The files or folders the work changes, as far as you know them — one per line, a file where known, else its folder; the estimate counts from it."
      placeholder: |
        src/orders/total.ts
        docs/
    validations:
      required: true

  - type: dropdown
    id: story-points
    attributes:
      label: Story Points
      description: "Complexity as a size, 1/2/3/5/8 — XL means split; a parent carries the sum of its sub-issues"
      options:
        - "Unknown"
        - "1 - XS"
        - "2 - S"
        - "3 - M"
        - "5 - L"
        - "8 - XL (split)"
    validations:
      required: true
